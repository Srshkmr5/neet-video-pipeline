<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot Product Simulation</title>
  <style>
    body {
      margin: 0;
      background: #020b16;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 32px auto;
      padding: 20px;
      box-sizing: border-box;
    }
    .panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(125, 211, 252, 0.08);
    }
    .title {
      color: #7dd3fc;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .control {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 180px;
    }
    label {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    .value {
      color: #fbbf24;
      font-weight: bold;
      font-size: 12px;
    }
    canvas {
      width: 100%;
      height: 420px;
      background: linear-gradient(180deg, #081521 0%, #0b1729 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="title">P11-C04-T01-V01 • Scalar Product and Work</div>
      <div class="controls">
        <div class="control">
          <label>Force F</label>
          <input id="force" type="range" min="10" max="150" step="5" value="60" />
          <div class="value" id="forceValue">60 N</div>
        </div>
        <div class="control">
          <label>Angle θ</label>
          <input id="theta" type="range" min="0" max="90" step="5" value="30" />
          <div class="value" id="thetaValue">30°</div>
        </div>
        <div class="control">
          <label>Displacement d</label>
          <input id="distance" type="range" min="2" max="18" step="1" value="10" />
          <div class="value" id="distanceValue">10 m</div>
        </div>
      </div>

      <canvas id="scene"></canvas>
    </div>
  </div>

  <script src="./units/unit_04/v01_dot_product.js"></script>
</body>
</html>
